name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JavaScript / test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Install Chromium and runtime dependencies
        run: npx playwright install --with-deps chromium
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Validate JavaScript and licenses
        run: npm run lint && npm run test:unit && npm run check:licenses
      - name: Test browser and API behavior
        run: npm run test:e2e
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit all npm dependencies
        run: npm audit --audit-level=high

  rust:
    name: Rust / check
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show runner toolchain
        run: rustc --version && cargo --version
      - name: Format, lint, and test
        run: npm run check:rust
      - name: Install pinned RustSec scanner
        run: cargo install cargo-audit --locked --version 0.22.1
      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock